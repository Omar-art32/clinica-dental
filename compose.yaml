services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinica-dental-app
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  node:
    image: node:22-alpine
    container_name: clinica-dental-node
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html

  db:
    image: mariadb:10.11
    container_name: clinica-dental-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: clinica_dental_2026
      MARIADB_USER: clinica
      MARIADB_PASSWORD: clinica
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - clinica_dental_db:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: clinica-dental-pma
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: clinica-dental-nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

volumes:
  clinica_dental_db:

